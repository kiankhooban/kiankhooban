<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kian Khooban. Deep learning for medical imaging. Compute-in-memory and computer arithmetic.">
  <style>
    @font-face {
      font-family: 'MatDisplay';
      src: url(data:font/woff2;base64,) format('woff2');
    }
    @font-face {
      font-family: 'MatText';
      src: url(data:font/woff2;base64,) format('woff2');
    }

    .name {
      font-family: 'MatDisplay', 'Arial Black', Arial, sans-serif;
      font-size: 54px; letter-spacing: 4px;
      fill: #F4F8F2;
    }
    .tag {
      font-family: 'MatText', Arial, sans-serif;
      font-size: 14.5px; letter-spacing: 1.5px;
      fill: #E9D27E;
    }
    .num {
      font-family: 'MatText', Arial, sans-serif;
      font-size: 8.5px; letter-spacing: 0.5px;
      fill: #CFE3D3; opacity: 0.55;
    }

    /* Chromium can freeze SVG-as-image at the FIRST FRAME (seen
       nondeterministically on GitHub). So: no entrance animations; t=0 is
       the complete hero. Only the sheen drift and the tagline cycle animate,
       and both look correct frozen at t=0 (tagline 1 starts visible). */
    #tagsG .tag:nth-of-type(1) { animation: cycleA 13.5s linear infinite; }
    #tagsG .tag:nth-of-type(2) { opacity: 0; animation: cycleB 13.5s linear 4.5s infinite; }
    #tagsG .tag:nth-of-type(3) { opacity: 0; animation: cycleB 13.5s linear 9s infinite; }

    #sheen { animation: sheenDrift 30s ease-in-out 2s infinite alternate; }
    @keyframes sheenDrift { to { transform: translate(180px, 20px); } }

    /* First tagline starts visible (robust static frame), then joins the cycle. */
    @keyframes cycleA {
      0%    { opacity: 1; transform: translateY(0); }
      29.5% { opacity: 1; transform: translateY(0); }
      33%   { opacity: 0; transform: translateY(-5px); }
      96.5% { opacity: 0; transform: translateY(5px); }
      100%  { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycleB {
      0%    { opacity: 0; transform: translateY(5px); }
      2.5%  { opacity: 1; transform: translateY(0); }
      29.5% { opacity: 1; transform: translateY(0); }
      33%   { opacity: 0; transform: translateY(-5px); }
      100%  { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #tagsG .tag, #sheen { animation: none; }
      #tagsG .tag:nth-of-type(2), #tagsG .tag:nth-of-type(3) { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="matBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#256B4F"/>
      <stop offset="100%" stop-color="#1D5840"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="0%"   stop-color="#0A241A" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#0A241A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A241A" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="sheenG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fineGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(28,28)">
      <path d="M56 0H0V56" fill="none" stroke="#DCEADF" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="28" y="28" width="784" height="184"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="840" height="240" rx="10"/>
    </clipPath>
  </defs>

  <!-- Mat body -->
  <rect x="0.5" y="0.5" width="839" height="239" rx="10" fill="url(#matBase)" stroke="#16382B"/>

  <g clip-path="url(#panelClip)">
    <!-- Working-area grid, clipped to the printed frame -->
    <g clip-path="url(#frameClip)">
      <rect x="28" y="28" width="784" height="184" fill="url(#fineGrid)"/>
      <rect x="28" y="28" width="784" height="184" fill="url(#majorGrid)"/>
      <!-- 45-degree bias guides -->
      <path d="M28 212 L212 28" stroke="#DCEADF" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M812 212 L628 28" stroke="#DCEADF" stroke-opacity="0.10" stroke-width="1"/>
      <!-- Center circle guides -->
      <circle cx="420" cy="120" r="56"  fill="none" stroke="#DCEADF" stroke-opacity="0.08"/>
      <circle cx="420" cy="120" r="100" fill="none" stroke="#DCEADF" stroke-opacity="0.08"/>
      <!-- Old cut scores: the self-healing part of the story -->
      <path d="M168 158 L318 96"  stroke="#0B241A" stroke-opacity="0.18" stroke-width="0.8"/>
      <path d="M548 66 L648 130"  stroke="#0B241A" stroke-opacity="0.14" stroke-width="0.8"/>
      <path d="M402 196 L556 176" stroke="#0B241A" stroke-opacity="0.12" stroke-width="0.8"/>
    </g>

    <!-- Printed frame line -->
    <rect x="28" y="28" width="784" height="184" fill="none" stroke="#DCEADF" stroke-opacity="0.45" stroke-width="1.2"/>

    <!-- Edge numerals: top scale every major line, left scale -->
    <g text-anchor="middle">
      <text class="num" x="84"  y="21">5</text>
      <text class="num" x="140" y="21">10</text>
      <text class="num" x="196" y="21">15</text>
      <text class="num" x="252" y="21">20</text>
      <text class="num" x="308" y="21">25</text>
      <text class="num" x="364" y="21">30</text>
      <text class="num" x="420" y="21">35</text>
      <text class="num" x="476" y="21">40</text>
      <text class="num" x="532" y="21">45</text>
      <text class="num" x="588" y="21">50</text>
      <text class="num" x="644" y="21">55</text>
      <text class="num" x="700" y="21">60</text>
      <text class="num" x="756" y="21">65</text>
      <text class="num" x="16" y="87">5</text>
      <text class="num" x="16" y="143">10</text>
      <text class="num" x="16" y="199">15</text>
    </g>
    <text class="num" x="196" y="44" text-anchor="start">45&#176;</text>

    <!-- Light sweep across the mat surface -->
    <ellipse id="sheen" cx="290" cy="80" rx="270" ry="120" fill="url(#sheenG)"/>

    <!-- Edge vignette for surface depth -->
    <rect x="0" y="0" width="840" height="240" fill="url(#vignette)"/>
  </g>

  <text class="name" x="422" y="118" text-anchor="middle">KIAN KHOOBAN</text>

  <g id="tagsG">
    <text class="tag" x="421" y="168" text-anchor="middle">deep learning for medical imaging</text>
    <text class="tag" x="421" y="168" text-anchor="middle">compute-in-memory &amp; computer arithmetic</text>
    <text class="tag" x="421" y="168" text-anchor="middle">hard guarantees in the core, intelligence at the edge</text>
  </g>
</svg>
